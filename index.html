<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KURULUŞTAN GÜNÜMÜZE ERZURUM - Tarih Portalı</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/togeojson/0.16.0/togeojson.min.js"></script>

    <style>
        /* ===== RENK ŞABLONLARI (🎨 düğmesiyle değişir) ===== */
        :root, html[data-tema="aksam"] { --bg: rgba(20,33,61,.94); --bg2:#1c2c52; --bg3:#24386a; --fg:#f5f1e8; --muted:#9fb0d0; --border:rgba(255,255,255,.14); --accent:#fca311; --accent2:#ff7b00; --on-accent:#14213d; }
        html[data-tema="kizil"] { --bg: rgba(17,17,17,.94); --bg2:#1e1e1e; --bg3:#2a2a2a; --fg:#fff; --muted:#aaa; --border:rgba(255,255,255,.14); --accent:#ef5350; --accent2:#ff9800; --on-accent:#fff; }
        html[data-tema="orman"] { --bg: rgba(14,38,31,.94); --bg2:#17382f; --bg3:#1f4a3d; --fg:#eef7f1; --muted:#9fc4b3; --border:rgba(255,255,255,.14); --accent:#34d399; --accent2:#a3e635; --on-accent:#06251c; }

        body { margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; }
        #map { width: 100vw; height: 100vh; }

        /* Açılış ekranı */
        #drop-zone { position: absolute; inset: 0; background: rgba(20,25,35,.9); color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20000; text-align: center; }
        #drop-zone.hidden { display: none; }
        .upload-box { border: 2px dashed var(--accent); padding: 35px 45px; border-radius: 12px; background: rgba(255,255,255,.08); backdrop-filter: blur(8px); max-width: 420px; }
        .file-btn { margin-top: 15px; padding: 10px 22px; background: var(--accent); color: var(--on-accent); border: none; border-radius: 6px; cursor: pointer; font-size: .95rem; font-weight: bold; }

        /* ===== ÜST ÇUBUK: başlık • bilgi • arama • şablon ===== */
        #ust-cubuk { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 10001; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; pointer-events: none; }
        #ust-cubuk > * { pointer-events: auto; }
        #toggle-btn { background: linear-gradient(135deg,var(--accent),var(--accent2)); color: var(--on-accent); border: none; padding: 11px 18px; border-radius: 30px; cursor: pointer; font-weight: 800; font-size: 13px; letter-spacing: .3px; box-shadow: 0 4px 15px rgba(0,0,0,.3); animation: btn-glow 1.8s infinite; }
        #toggle-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 22px 7px; border-radius: 24px; }
        #toggle-btn .yon { width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; opacity: .85; animation: yon-asagi 1.8s ease-in-out infinite; }
        #toggle-btn.acik .yon { animation-name: yon-yukari; margin-top: 3px; }
        @keyframes yon-asagi { 0%,100%{transform:translateY(0) rotate(45deg)} 50%{transform:translateY(3px) rotate(45deg)} }
        @keyframes yon-yukari { 0%,100%{transform:translateY(0) rotate(225deg)} 50%{transform:translateY(-3px) rotate(225deg)} }
        @keyframes btn-glow { 0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)} 70%{box-shadow:0 0 0 14px transparent} 100%{box-shadow:0 0 0 0 transparent} }
        @keyframes pin-bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
        #bilgi-btn, #tema-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--bg); color: var(--accent); border: 2px solid var(--accent); cursor: pointer; padding: 0; box-shadow: 0 4px 15px rgba(0,0,0,.3); backdrop-filter: blur(8px); }
        #bilgi-btn { font: italic bold 24px/36px Georgia, serif; animation: bilgi-halka 1.8s infinite, bilgi-salla 4s infinite; }
        #tema-btn { font-size: 18px; border-color: var(--border); }
        #bilgi-btn:hover, #tema-btn:hover { background: var(--accent); color: var(--on-accent); }
        @keyframes bilgi-halka { 0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 80%,transparent)} 70%{box-shadow:0 0 0 14px transparent} 100%{box-shadow:0 0 0 0 transparent} }
        @keyframes bilgi-salla { 0%,88%,100%{transform:rotate(0)} 91%{transform:rotate(-14deg)} 94%{transform:rotate(14deg)} 97%{transform:rotate(-8deg)} }

        #arama-kutusu { position: relative; flex: 1 1 240px; max-width: 420px; display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 30px; padding: 0 14px; box-shadow: 0 4px 15px rgba(0,0,0,.3); backdrop-filter: blur(8px); }
        #arama-kutusu input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--fg); padding: 11px 4px; font-size: 13px; }
        #arama-kutusu input::placeholder { color: var(--muted); }
        #arama-kutusu:focus-within { border-color: var(--accent); }
        #clear-cmd-btn { cursor: pointer; color: var(--muted); font-size: 12px; font-weight: bold; display: none; }
        #clear-cmd-btn:hover { color: var(--accent); }
        #ai-sonuc { position: absolute; top: 100%; left: 12px; margin-top: 6px; background: var(--bg); color: var(--accent); border: 1px solid var(--border); border-radius: 12px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
        #ai-sonuc:empty { display: none; }

        /* ===== BÖLÜMLER PANELİ ===== */
        #tarihiEserlerPaneli { position: fixed; top: 70px; left: 12px; width: 330px; max-width: calc(100vw - 24px); max-height: calc(100vh - 85px); background: var(--bg); color: var(--fg); box-shadow: 0 10px 30px rgba(0,0,0,.4); border-radius: 14px; z-index: 10000; overflow-y: auto; padding: 15px; box-sizing: border-box; border: 1px solid var(--border); backdrop-filter: blur(8px); opacity: 0; visibility: hidden; transform: translateY(-10px); transition: all .3s ease; scrollbar-width: thin; scrollbar-color: var(--accent) transparent; }
        #tarihiEserlerPaneli.active { opacity: 1; visibility: visible; transform: none; }
        .panel-ust { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .panel-baslik { font-weight: 800; font-size: 14px; } .panel-baslik b { color: var(--accent); }
        .kapat-btn { background: var(--accent); color: var(--on-accent); border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; }
        details.dinamik-kategori { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; padding: 6px 8px; }
        details.alt-kategori-details { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; margin: 6px 0 6px 12px; padding: 5px 8px; border-left: 3px solid var(--accent); }
        summary { list-style: none; outline: none; } summary::-webkit-details-marker { display: none; }
        summary.dinamik-baslik, summary.alt-kategori-baslik { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; padding-right: 6px; }
        summary.dinamik-baslik { font-weight: bold; color: var(--fg); font-size: 13px; }
        summary.alt-kategori-baslik { font-weight: 600; color: var(--accent); font-size: 12px; }
        .baslik-sol { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .ok-ikonu { display: inline-block; font-size: 10px; color: var(--muted); transition: transform .2s ease; }
        details[open] > summary .baslik-sol .ok-ikonu { transform: rotate(90deg); color: var(--accent); }
        .sayi-rozet { font-size: 11px; color: var(--accent); background: color-mix(in srgb,var(--accent) 18%,transparent); padding: 1px 7px; border-radius: 10px; margin-left: 4px; font-weight: 600; white-space: nowrap; }
        .panel-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 8px; font-size: 12px; border-bottom: 1px dashed var(--border); cursor: pointer; color: var(--fg); border-radius: 4px; transition: all .2s; list-style-type: none; }
        .panel-item.aktif-degil { color: var(--muted); opacity: .6; font-style: italic; }
        .panel-item:hover { background: color-mix(in srgb,var(--accent) 22%,transparent); padding-left: 12px; font-weight: bold; }
        .goz-ikonu { cursor: pointer; font-size: 14px; transition: all .2s ease; opacity: .85; user-select: none; }
        .goz-ikonu:hover { opacity: 1; transform: scale(1.15); }
        .goz-ikonu.gizli { opacity: .35; text-decoration: line-through; filter: grayscale(100%); }
        .item-goz { display: none; }

        /* ===== HARİTA PANELİ (sol alt): zemin + cadde/sokak alanı ===== */
        .harita-paneli { background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; box-shadow: 0 6px 20px rgba(0,0,0,.35); backdrop-filter: blur(8px); width: 230px; font-size: 12px; }
        .hp-baslik { font-weight: 800; margin-bottom: 8px; color: var(--accent); }
        .hp-segment { display: flex; gap: 6px; }
        .hp-segment button { flex: 1; padding: 7px 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg2); color: var(--fg); cursor: pointer; font-size: 12px; font-weight: 600; }
        .hp-segment button.aktif { background: var(--accent); color: var(--on-accent); border-color: transparent; }
        #hp-sur { margin-top: 8px; } #hp-sur label { display: block; color: var(--muted); margin-bottom: 3px; }
        #hp-sur select { width: 100%; padding: 6px; border-radius: 8px; background: var(--bg2); color: var(--fg); border: 1px solid var(--border); font-size: 12px; }

        /* Yakınlaştırma (+/−) ve künye */
        .leaflet-bar { border: 1px solid var(--border) !important; border-radius: 12px !important; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.3) !important; }
        .leaflet-bar a { background: var(--bg) !important; color: var(--fg) !important; border-bottom: 1px solid var(--border) !important; width: 36px !important; height: 36px !important; line-height: 36px !important; font-size: 18px; }
        .leaflet-bar a:hover { background: var(--accent) !important; color: var(--on-accent) !important; }
        .leaflet-control-attribution { background: var(--bg) !important; color: var(--muted) !important; } .leaflet-control-attribution a { color: var(--accent) !important; }

        /* Bilgi kartları (popup): kapat (x) + kaydırma çubuğu */
        .leaflet-popup-close-button { width: 26px !important; height: 26px !important; top: 6px !important; right: 6px !important; font: bold 20px/24px Arial, sans-serif !important; color: var(--on-accent) !important; background: var(--accent); border-radius: 50%; text-align: center; padding: 0 !important; z-index: 5; }
        .leaflet-popup-close-button:hover { filter: brightness(.9); }
        .leaflet-popup-scrolled { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--accent) #eee; padding-right: 8px; }
        .leaflet-popup-scrolled::-webkit-scrollbar { width: 6px; } .leaflet-popup-scrolled::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
        .leaflet-popup-content { margin: 14px 26px 12px 14px; }

        /* Proje bilgi kartı */
        #proje-bilgi-karti { display: none; position: fixed; z-index: 20001; top: 80px; left: 50%; transform: translateX(-50%); width: min(440px, 92vw); max-height: 80vh; overflow-y: auto; background: #fff; color: #333; border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.45); padding: 20px 24px; box-sizing: border-box; font-size: 13px; line-height: 1.55; scrollbar-width: thin; scrollbar-color: var(--accent) #eee; }
        #proje-bilgi-karti.aktif { display: block; }
        #proje-bilgi-karti h3 { margin: 0 24px 12px 0; text-align: center; font-size: 16px; border-bottom: 2px solid var(--accent); padding-bottom: 8px; }
        #proje-bilgi-karti .kapat { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border: none; border-radius: 50%; background: var(--accent); color: var(--on-accent); font: bold 14px/26px Arial; cursor: pointer; padding: 0; }

        path.sur-alan { pointer-events: stroke !important; }
        .radar-pulse { position: relative; width: 20px; height: 20px; background: transparent; }
        .radar-pulse::after { content: ""; position: absolute; top: -15px; left: -15px; width: 50px; height: 50px; background: rgba(255,235,59,.6); border-radius: 50%; animation: pulse-ring 1.2s cubic-bezier(.215,.61,.355,1) infinite; }
        @keyframes pulse-ring { 0%{transform:scale(.1);opacity:1} 100%{transform:scale(2.5);opacity:0} }

        @media (max-width: 700px) { #toggle-btn { font-size: 11px; padding: 9px 12px; } #arama-kutusu { flex-basis: 100%; max-width: none; } .harita-paneli { width: 200px; } }
    </style>
</head>
<body>

<div id="drop-zone">
    <div class="upload-box">
        <h2 style="margin-top:0;">KURULUŞTAN GÜNÜMÜZE ERZURUM</h2>
        <p>Elinizdeki <b>.kml</b> dosyasını buraya sürükleyip bırakın</p>
        <input type="file" id="file-input" accept=".kml" style="display: none;">
        <button class="file-btn" id="file-btn-text" onclick="document.getElementById('file-input').click()">KML Dosyası Seç</button>
    </div>
</div>

<div id="ust-cubuk">
  <button id="toggle-btn" onclick="panelToggle()"><span class="bt-yazi">KURULUŞTAN GÜNÜMÜZE ERZURUM</span><span class="yon"></span></button>
  <button id="bilgi-btn" onclick="projeBilgisiAc()" title="Harita hakkında bilgi">i</button>
  <div id="arama-kutusu">
    <span>🔍</span>
    <input type="text" id="ai-cmd" list="kategori-listesi" autocomplete="off" placeholder="Arama: mezarlıklar, cami, ulu cami, 4. sur…">
    <datalist id="kategori-listesi"></datalist>
    <span id="clear-cmd-btn" title="Aramayı Temizle">✖</span>
    <div id="ai-sonuc"></div>
  </div>
  <button id="tema-btn" onclick="temaDegistir()" title="Renk şablonunu değiştir">🎨</button>
</div>

<div id="proje-bilgi-karti"><button class="kapat" onclick="projeBilgisiKapat()" title="Kapat">✕</button><h3 id="pb-baslik"></h3><div id="pb-icerik"></div></div>

<div id="tarihiEserlerPaneli">
  <div class="panel-ust">
    <span class="panel-baslik">📚 Bölümler <b id="toplamEserRozet">(0)</b></span>
    <button class="kapat-btn" onclick="panelToggle()">✕ Kapat</button>
  </div>
  <div id="dinamik-menu-alani"></div>
</div>

<div id="map"></div>

<script src="icerik.js"></script>

<script>
    // ===== RENK ŞABLONU =====
    var TEMALAR = ['aksam', 'kizil', 'orman'];
    function temaUygula(t) { document.documentElement.setAttribute('data-tema', t); try { localStorage.setItem('erzurumTema', t); } catch (e) {} }
    function temaDegistir() { var m = document.documentElement.getAttribute('data-tema') || 'aksam'; temaUygula(TEMALAR[(TEMALAR.indexOf(m) + 1) % TEMALAR.length]); }
    (function() { var t = 'aksam'; try { t = localStorage.getItem('erzurumTema') || t; } catch (e) {} temaUygula(TEMALAR.indexOf(t) >= 0 ? t : 'aksam'); })();

    // ===== DOSYA YÜKLEME: en başta tanımlanır, icerik.js hatalı olsa bile çalışır =====
    window.addEventListener('dragover', function(e) { e.preventDefault(); });
    window.addEventListener('drop', function(e) { e.preventDefault(); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
    document.getElementById('file-input').addEventListener('change', function(e) { if (e.target.files[0]) handleFile(e.target.files[0]); });

    if (typeof menuHiyerarsisi === 'undefined') {
        console.error("icerik.js yüklenemedi veya 'menuHiyerarsisi' tanımlı değil.");
        window.menuHiyerarsisi = {};
        setTimeout(function() { alert("UYARI: icerik.js bulunamadı veya hatalı. index.html ile aynı klasörde olmalı ve içinde 'var menuHiyerarsisi = {...}' tanımı bulunmalı. Menü boş görünecek."); }, 300);
    }

    var map = L.map('map', { zoomControl: false }).setView([39.90618, 41.27666], 14);
    // ===== ZEMİN: yalnızca cadde ve sokak adları =====
    var surNoktalari = { 1: [], 2: [], 3: [], 4: [] };   // 1.-4. sur çizgilerinin noktaları
    var surSiniri = null;                 // cadde/sokakların görüneceği alan (sur dış zarfı)

    L.control.zoom({ position: 'bottomright' }).addTo(map);
    map.createPane('surPane').style.zIndex = 450;
    map.createPane('noktaPane').style.zIndex = 460;

    // Karoları seçilen sur sınırı içinde kırparak çizen katman
    L.KirpilmisKatman = L.TileLayer.extend({
        createTile: function(coords, done) {
            var size = this.getTileSize(), tile = document.createElement('canvas'), self = this;
            tile.width = size.x; tile.height = size.y;
            var img = new Image();
            img.onload = function() {
                var ctx = tile.getContext('2d');
                if (surSiniri && self._map) {
                    var o = coords.scaleBy(size);
                    ctx.beginPath();
                    surSiniri.forEach(function(ll, k) {
                        var p = self._map.project(L.latLng(ll[0], ll[1]), coords.z).subtract(o);
                        if (k) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y);
                    });
                    ctx.closePath(); ctx.clip();
                }
                ctx.drawImage(img, 0, 0, size.x, size.y);
                done(null, tile);
            };
            img.onerror = function() { done(null, tile); };
            img.src = this.getTileUrl(coords);
            return tile;
        }
    });

    var googlePureUydu = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 20, maxNativeZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'] });
    var sokakAdlari = new L.KirpilmisKatman('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 18, zIndex: 5 });

    googlePureUydu.addTo(map);
    sokakAdlari.addTo(map);   // iki zeminde de aynı: yalnızca cadde/sokak çizgi ve adları
    var sokakHaritasi = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 18 });

    function disbukeyZarf(P) {
        P.sort(function(a, b) { return a[0] - b[0] || a[1] - b[1]; });
        if (P.length < 3) return P;
        var cr = function(o, a, b) { return (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]); };
        var A = [], B = [], k, p;
        for (k = 0; k < P.length; k++) { p = P[k]; while (A.length >= 2 && cr(A[A.length-2], A[A.length-1], p) <= 0) A.pop(); A.push(p); }
        for (k = P.length - 1; k >= 0; k--) { p = P[k]; while (B.length >= 2 && cr(B[B.length-2], B[B.length-1], p) <= 0) B.pop(); B.push(p); }
        A.pop(); B.pop();
        return A.concat(B);
    }

    function surSiniriniUygula(mod) {
        surSiniri = null;
        if (mod === 'sur') {
            var pts = [];
            [4, 3, 2, 1].some(function(n) { if (surNoktalari[n].length >= 3) { pts = surNoktalari[n].slice(); return true; } return false; });
            var zarf = disbukeyZarf(pts);
            if (zarf.length >= 3) surSiniri = zarf.map(function(p) { return [p[1], p[0]]; });
        }
        sokakAdlari.redraw();
    }

    function surSiniriSecenekleriniKur() {
        var sec = document.getElementById('sur-siniri-sec');
        if (!sec) return;
        sec.innerHTML = '<option value="">Tüm Harita</option><option value="sur">Surlar İçi Erzurum</option>';
        var var_ = [1, 2, 3, 4].some(function(n) { return surNoktalari[n].length >= 3; });
        sec.value = var_ ? 'sur' : '';
        surSiniriniUygula(sec.value);
    }

    // Zemin değiştirme: Uydu = uydu + yalnızca cadde/sokak adları; Sokak = eski Esri sokak haritası
    function zeminSec(tur) {
        var sokak = (tur === 'sokak');
        if (sokak) { map.removeLayer(googlePureUydu); map.removeLayer(sokakAdlari); if (!map.hasLayer(sokakHaritasi)) sokakHaritasi.addTo(map); }
        else { map.removeLayer(sokakHaritasi); if (!map.hasLayer(googlePureUydu)) googlePureUydu.addTo(map); if (!map.hasLayer(sokakAdlari)) sokakAdlari.addTo(map); }
        document.getElementById('zemin-uydu').classList.toggle('aktif', !sokak);
        document.getElementById('zemin-sokak').classList.toggle('aktif', sokak);
        document.getElementById('hp-sur').style.display = sokak ? 'none' : 'block';
    }

    var HaritaPaneli = L.control({ position: 'bottomleft' });
    HaritaPaneli.onAdd = function() {
        var div = L.DomUtil.create('div', 'harita-paneli');
        div.innerHTML = '<div class="hp-baslik">🗺️ Harita</div>' +
            '<div class="hp-segment"><button id="zemin-uydu" class="aktif" title="Uydu + yalnızca cadde/sokak adları">🛰️ Uydu</button><button id="zemin-sokak" title="Sokak haritası">🗺️ Sokak</button></div>' +
            '<div id="hp-sur"><label>Cadde/sokak alanı</label><select id="sur-siniri-sec"><option value="">Tüm Harita</option><option value="sur">Surlar İçi Erzurum</option></select></div>';
        L.DomEvent.disableClickPropagation(div);
        div.querySelector('#zemin-uydu').onclick = function() { zeminSec('uydu'); };
        div.querySelector('#zemin-sokak').onclick = function() { zeminSec('sokak'); };
        div.querySelector('select').onchange = function() { surSiniriniUygula(this.value); };
        return div;
    };
    HaritaPaneli.addTo(map);

    var markerKatmanlari = L.layerGroup().addTo(map);
    var radarKatmani = L.layerGroup().addTo(map); 

    var gruplanmisKatmanlar = {}; 
    var listeElemanlari = {};      // key -> [ {li, goz, ustKategoriKodu, orijinalIsim}, ... ]
    var kategoriAcikDurumu = {}; 
    var usteBagliGruplar = {}; 
    var kategoriIndeksi = {};     // normalize kategori adı -> { baslik, eserler:[normalize eser adları] }

    // Fotoğraf dosya adları için ESKİ kural (mevcut dosyalarınız bozulmasın diye korunur)
    function eskiResimAdi(str) {
        if (!str) return '';
        return String(str).replace(/İ/g, 'i').replace(/I/g, 'ı').toLowerCase()
            .replace(/ı/g, 'i').replace(/i/g, 'i').replace(/ş/g, 's')
            .replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ö/g, 'o').replace(/ç/g, 'c')
            .replace(/[^a-z0-9]/g, '');
    }

    // Eşleştirme kuralı: şapkalı harfler (â, î, û) sade harfle aynı sayılır
    function normalizeName(str) {
        if (!str) return '';
        return String(str).replace(/İ/g, 'i').replace(/I/g, 'ı').toLowerCase()
            .replace(/â/g, 'a').replace(/î/g, 'i').replace(/û/g, 'u')
            .replace(/ı/g, 'i').replace(/i/g, 'i').replace(/ş/g, 's')
            .replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ö/g, 'o').replace(/ç/g, 'c')
            .replace(/[^a-z0-9]/g, '');
    }

    // Baştaki nokta, madde işareti vb. karakterleri kaldırır (".Hatice Hanım Değirmeni" -> "Hatice Hanım Değirmeni")
    function adTemizle(t) { return String(t).replace(/^[^\p{L}\p{N}(]+/u, '').trim(); }

    var EMOJI_RENK = { '🟤': '#ff9800', '🟠': '#ff9800', '🟡': '#fbc02d', '🟢': '#4caf50', '🟣': '#9c27b0', '🔵': '#2196f3', '🔴': '#e53935' };
    var kategoriRenkleri = {};   // üst kategori kodu -> bölüm başlığındaki renk

    function tumEserleriGetir(icerik, liste = []) {
        if (Array.isArray(icerik)) {
            icerik.forEach(isim => liste.push(isim));
        } else {
            for (const key in icerik) tumEserleriGetir(icerik[key], liste);
        }
        return liste;
    }

    // ===== AYNI İSİMLİ ESERLERİN SAYILARI =====
    var GEREKLI_SAYILAR = {
        "Kâbe Mescidi": 2, "Mutaflar Çarşısı": 2, "Dökmeciler Çarşısı": 2, "Mutafhâne": 2,
        "Boyahâne": 2, "Tophâne": 2, "Askeri Rüşdiye": 2, "Mansurizâde Vakfı Değirmeni": 2,
        "Acem Fırını": 3, "İptidai Mektebi": 3, "Rüşdiye": 3, "Sıbyan Mektebi": 3,
        "Mumhâne": 6, "Puruthâne": 4, "Değirmen": 7
    };

    // Menüde eksik kalan aynı isimli satırları, istenen sayıya göre tamamlar
    function eksikEserleriTamamla(veri) {
        var hedef = {};
        Object.entries(GEREKLI_SAYILAR).forEach(([isim, n]) => { hedef[normalizeName(isim)] = n; });

        var mevcut = {};
        (function say(v) {
            if (Array.isArray(v)) v.forEach(i => { var k = normalizeName(i); mevcut[k] = (mevcut[k] || 0) + 1; });
            else for (var key in v) say(v[key]);
        })(veri);

        var eklendi = {};
        (function ekle(v) {
            if (Array.isArray(v)) {
                for (var i = v.length - 1; i >= 0; i--) {
                    var k = normalizeName(v[i]);
                    if (hedef[k] && !eklendi[k]) {
                        eklendi[k] = true;
                        var eksik = hedef[k] - mevcut[k];
                        for (var j = 0; j < eksik; j++) v.splice(i + 1, 0, v[i]);
                    }
                }
            } else for (var key in v) ekle(v[key]);
        })(veri);
    }

    function emojiTemizle(t) {
        return String(t).replace(/[^\p{L}\p{N}\s.,()\/'-]/gu, '').replace(/\s+/g, ' ').trim();
    }

    // Bir bölüm için aranabilir adları üretir. Alt bölümlerde üst bölümün baş harfleriyle
    // kısaltma da eklenir: "Cami, Mescit" + "OSMANLI DÖNEMİ ÖNCESİ" -> "Cami, Mescit (O.D.Ö)"
    function kategoriEtiketleriUret(baslik, ustBaslik) {
        var temiz = emojiTemizle(baslik);
        var liste = [{ etiket: temiz, oneri: true }];
        if (ustBaslik) {
            var ust = emojiTemizle(ustBaslik);
            var kisa = ust.split(' ').filter(Boolean).map(function(w) { return w.charAt(0).toLocaleUpperCase('tr'); }).join('.');
            liste.push({ etiket: temiz + ' (' + kisa + ')', oneri: true });
            liste.push({ etiket: ust + ' ' + temiz, oneri: false });
        }
        return liste;
    }

    function menuyuOlustur(veri, hedefEleman, seviye = 1, ustKategoriKodu = "", ustBaslik = "") {
        for (const [baslik, icerik] of Object.entries(veri)) {
            let details = document.createElement('details');
            details.className = seviye === 1 ? 'dinamik-kategori' : 'alt-kategori-details';

            // KURAL: Sadece SURLAR ve KAPILAR varsayılan olarak açık başlar
            let baslikKod = normalizeName(baslik);   // emojiler ve büyük/küçük harf fark etmez
            let varsayilanAcik = (baslikKod === 'surlar' || baslikKod === 'kapilar');
            if (varsayilanAcik) details.open = true;
            
            let currentKategoriKodu = ustKategoriKodu || normalizeName(baslik);
            if (seviye === 1) {
                kategoriAcikDurumu[currentKategoriKodu] = varsayilanAcik;
                for (var em in EMOJI_RENK) { if (baslik.indexOf(em) >= 0) { kategoriRenkleri[currentKategoriKodu] = EMOJI_RENK[em]; break; } }
            }
            let gorunenBaslik = currentKategoriKodu === 'surlar' ? baslik.replace('🟤', '🟠') : baslik;

            let summary = document.createElement('summary');
            summary.className = seviye === 1 ? 'dinamik-baslik' : 'alt-kategori-baslik';
            
            let baslikSol = document.createElement('div');
            baslikSol.className = 'baslik-sol';
            
            // BÖLÜM VE ALT BÖLÜM İÇERİK SAYISI (ROZET)
            let elemanSayisi = tumEserleriGetir(icerik).length;
            baslikSol.innerHTML = `<span class="ok-ikonu">▶</span><span>${gorunenBaslik}</span> <span class="sayi-rozet">(${elemanSayisi})</span>`;
            
            let gozIkonu = document.createElement('span');
            gozIkonu.className = 'goz-ikonu' + (kategoriAcikDurumu[currentKategoriKodu] ? '' : ' gizli');
            gozIkonu.innerHTML = '👁️'; 
            gozIkonu.title = 'Bölümü Göster/Gizle';
            
            let altEserListesi = tumEserleriGetir(icerik).map(i => normalizeName(i));

            // Toplu arama için bölüm / alt bölüm adını kaydet
            kategoriEtiketleriUret(baslik, ustBaslik).forEach(function(k) {
                let kNorm = normalizeName(k.etiket);
                if (!kNorm) return;
                if (!kategoriIndeksi[kNorm]) kategoriIndeksi[kNorm] = { baslik: k.etiket, eserler: [], oneri: k.oneri };
                kategoriIndeksi[kNorm].eserler = kategoriIndeksi[kNorm].eserler.concat(altEserListesi);
            });
            
            altEserListesi.forEach(normIsim => {
                usteBagliGruplar[normIsim] = currentKategoriKodu; 
            });

            gozIkonu.onclick = function(e) {
                e.preventDefault(); 
                e.stopPropagation(); 
                
                let gizliMi = gozIkonu.classList.toggle('gizli');
                let acikMı = !gizliMi;
                
                kategoriAcikDurumu[currentKategoriKodu] = acikMı;
                
                for (const [grupIsmi, grup] of Object.entries(gruplanmisKatmanlar)) {
                    let grupIsmiNorm = grup.baseNorm || normalizeName(grupIsmi);
                    if (altEserListesi.includes(grupIsmiNorm)) {
                        if (acikMı) {
                            if (!grup.options.bireyselGizli && !markerKatmanlari.hasLayer(grup)) {
                                markerKatmanlari.addLayer(grup);
                            }
                        } else {
                            if (markerKatmanlari.hasLayer(grup)) markerKatmanlari.removeLayer(grup);
                        }
                    }
                }
            };

            summary.appendChild(baslikSol);
            summary.appendChild(gozIkonu);
            details.appendChild(summary);

            let ul = document.createElement('ul');
            ul.style.cssText = "list-style: none; padding-left: 6px; margin: 4px 0;";

            if (Array.isArray(icerik)) {
                icerik.forEach(isim => {
                    let li = listeElemaniOlustur(isim, currentKategoriKodu);
                    if (li) ul.appendChild(li); 
                });
            } else {
                menuyuOlustur(icerik, ul, seviye + 1, currentKategoriKodu, baslik);
            }
            details.appendChild(ul);
            hedefEleman.appendChild(details);
        }
    }

    function listeElemaniOlustur(isim, ustKategoriKodu) {
        var safeIsim = adTemizle(isim);
        var testIsim = safeIsim.replace(/İ/g, 'i').replace(/I/g, 'ı').toLowerCase().replace(/\s+/g, '');
        
        var key = normalizeName(safeIsim);

        var li = document.createElement('li');
        li.className = 'panel-item aktif-degil';
        li.title = "KML'de henüz çizilmedi";
        if (kategoriRenkleri[ustKategoriKodu]) li.style.borderLeft = '3px solid ' + kategoriRenkleri[ustKategoriKodu];
        
        var isimSpan = document.createElement('span');
        isimSpan.innerText = safeIsim;
        li.appendChild(isimSpan);
        
        var itemGoz = null;
        if (testIsim.includes('1.sur') || testIsim.includes('2.sur') || testIsim.includes('3.sur') || testIsim.includes('4.sur')) {
            itemGoz = document.createElement('span');
            itemGoz.className = 'goz-ikonu item-goz';
            itemGoz.innerHTML = '👁️';
            li.appendChild(itemGoz);
        }
        
        if (!listeElemanlari[key]) listeElemanlari[key] = [];
        listeElemanlari[key].push({ li: li, goz: itemGoz, ustKategoriKodu: ustKategoriKodu, orijinalIsim: safeIsim });
        return li;
    }

    // Önce eksik satırları tamamla, sonra menüyü kur
    eksikEserleriTamamla(menuHiyerarsisi);
    menuyuOlustur(menuHiyerarsisi, document.getElementById('dinamik-menu-alani'));

    // GENEL TOPLAM SAYAÇ DEĞERİNİ YAZDIRMA
    var toplamEser = tumEserleriGetir(menuHiyerarsisi).length;
    var toplamRozetEl = document.getElementById('toplamEserRozet');
    if (toplamRozetEl) {
        toplamRozetEl.innerText = "(" + toplamEser + ")";
    }

    // ===== PROJE BİLGİSİ: KML'deki "Kuruluştan Günümüze Erzurum" noktası haritadan kaldırılır, bilgisi butonda gösterilir =====
    var projeBilgisi = null;
    var PROJE_BILGISI_VARSAYILAN = { baslik: 'Kuruluştan Günümüze Erzurum', html:
        '<p style="margin:0 0 8px;">Tarih boyu hükümranlık süren İmparatorluklar, Devletler ve Beylikler döneminde; 420’li yıllarda yapılan Kaleden günümüze kadar ulaşan ve ulaşamayan eserleri gösteren bu çalışmada;</p>' +
        '<ul style="margin:0;padding-left:18px;">' +
        '<li>Plan of Erzerum From the Reconnaissance of col. Ushakov, 1855,</li>' +
        '<li>Plan de la prise d\'Arzerum : par les troupes Russes, aux ordres du général Paskewitch, le 25 Juin 1829 /Creator: Avril, Charles Ryt. / Martenoz, V. Druk. ,1840</li>' +
        '<li>Osmanlı Dönemi Erzurum Şehir Haritası-2018, M. Küçükuğurlu - M. T. Tüfekçi</li>' +
        '<li>İller Bankası Analitik Etüdleri-1965</li>' +
        '<li>Erzurum Tarihi, Anıtları, Kitabeleri-1936, A. Ş. Beygu</li>' +
        '<li>Abideleri ve Kitabeleri ile Erzurum Tarihi-1960, İ. H. Konyalı</li>' +
        '<li>Harita Gn.Komutanlığı Kartografik Arşiv Şb.</li>' +
        '<li>Erzurum Camileri, Medreseler, Kütüphaneleri-2020, M. Küçükuğurlu</li>' +
        '<li>Erzurum Çarşı Pazar-2018, M. Küçükuğurlu</li>' +
        '<li>Vakıflar Gn. Müdürlüğü Arşivi, Başbakanlık Osmanlı Arşivlerinden faydalanılmıştır.</li>' +
        '</ul>' +
        '<div style="text-align:right;font-style:italic;margin-top:14px;">Murat Türker Tüfekçi</div>' };

    function projeBilgisiAc() {
        var b = projeBilgisi || PROJE_BILGISI_VARSAYILAN;
        document.getElementById('pb-baslik').textContent = String(b.baslik).toLocaleUpperCase('tr');
        document.getElementById('pb-icerik').innerHTML = b.html;
        document.getElementById('proje-bilgi-karti').classList.add('aktif');
    }
    function projeBilgisiKapat() { document.getElementById('proje-bilgi-karti').classList.remove('aktif'); }
    window.addEventListener('keydown', function(e) { if (e.key === 'Escape') projeBilgisiKapat(); });

    // Açılış butonu arama kutusunun yanına, liste paneli de butonun altına yerleşir
    function yerlestir() {
        var bar = document.getElementById('ust-cubuk'), pan = document.getElementById('tarihiEserlerPaneli');
        if (!bar || !pan) return;
        var r = bar.getBoundingClientRect();
        pan.style.top = (r.bottom + 8) + 'px';
        pan.style.maxHeight = 'calc(100vh - ' + (r.bottom + 23) + 'px)';
    }
    setTimeout(yerlestir, 150);
    window.addEventListener('resize', yerlestir);

    function panelToggle() {
        var a = document.getElementById('tarihiEserlerPaneli').classList.toggle('active');
        document.getElementById('toggle-btn').classList.toggle('acik', a);
    }


    // ===== TOPLU ARAMA (bölüm / alt bölüm adıyla) =====
    function turkceCogulKaldir(n) { return n.replace(/(lar|ler)$/, ''); }

    // Yazılan metne uyan bölüm adlarını bulur. Tam eşleşme varsa yalnızca onlar döner
    // (örn. "Cami, Mescit (O.D)" yazınca "(O.D.Ö)" karışmaz).
    function kategoriEslesmeleri(arananNorm) {
        var stem = turkceCogulKaldir(arananNorm);
        var tam = [], kismi = [];
        for (var kNorm in kategoriIndeksi) {
            var kStem = turkceCogulKaldir(kNorm);
            if (kNorm === arananNorm || kStem === stem) tam.push(kNorm);
            else if (arananNorm.length >= 3 && (kNorm.includes(arananNorm) || (stem.length >= 3 && kNorm.includes(stem)))) kismi.push(kNorm);
        }
        return tam.length ? { liste: tam, tam: true } : { liste: kismi, tam: false };
    }

    function stilleriSifirla() {
        for (const grup of Object.values(gruplanmisKatmanlar)) {
            grup.eachLayer(function(l) { if (l._orijinalStil && l.setStyle) l.setStyle(l._orijinalStil); });
        }
    }

    // Menü durumuna dön: yalnızca açık bölümlerin eserleri kalır, arama sonuçları haritadan kalkar
    function menuDurumunaGoreGeriYukle() {
        map.closePopup();
        radarKatmani.clearLayers();
        stilleriSifirla();
        for (const [isim, grup] of Object.entries(gruplanmisKatmanlar)) {
            let normGrup = grup.baseNorm || normalizeName(isim);
            let uKatKod = usteBagliGruplar[normGrup] || "";
            let goster = uKatKod && kategoriAcikDurumu[uKatKod] === true && !grup.options.bireyselGizli;
            if (goster) { if (!markerKatmanlari.hasLayer(grup)) markerKatmanlari.addLayer(grup); }
            else if (markerKatmanlari.hasLayer(grup)) markerKatmanlari.removeLayer(grup);
        }
    }

    var aramaZamanlayici = null;   // bekleyen popup/vurgu işlemi (eski aramadan kalmasın)

    function sonucYaz(metin) {
        var el = document.getElementById('ai-sonuc');
        if (el) el.textContent = metin || '';
    }

    setTimeout(function() {
        var cmdInput = document.getElementById('ai-cmd');
        var clearBtn = document.getElementById('clear-cmd-btn');

        // Öneri listesi: tüm bölüm ve alt bölüm adları
        var dl = document.getElementById('kategori-listesi');
        if (dl) {
            Object.keys(kategoriIndeksi).forEach(function(k) {
                if (!kategoriIndeksi[k].oneri) return;
                var opt = document.createElement('option');
                opt.value = kategoriIndeksi[k].baslik;
                dl.appendChild(opt);
            });
        }

        if (cmdInput) {
            cmdInput.addEventListener('input', function(e) {
                clearTimeout(aramaZamanlayici); map.stop();
                var aranan = e.target.value.trim();
                var arananNorm = normalizeName(aranan);
                if (clearBtn) clearBtn.style.display = aranan.length > 0 ? 'block' : 'none';

                stilleriSifirla();
                if (aranan === "" || arananNorm === "") {
                    menuDurumunaGoreGeriYukle();
                    sonucYaz('');
                    return;
                }

                // "hepsi" komutu: her şeyi göster
                if (arananNorm === 'hepsi' || arananNorm === 'tumu') {
                    var tumu = [];
                    for (const grup of Object.values(gruplanmisKatmanlar)) {
                        if (!markerKatmanlari.hasLayer(grup)) markerKatmanlari.addLayer(grup);
                        tumu.push(grup);
                    }
                    sonucYaz(tumu.length + ' eser gösteriliyor');
                    return;
                }

                // Bölüm / alt bölüm eşleşmesi
                var km = kategoriEslesmeleri(arananNorm);
                var eslesenKat = km.liste;
                var kategoriSeti = new Set();
                eslesenKat.forEach(function(k) { kategoriIndeksi[k].eserler.forEach(function(n) { kategoriSeti.add(n); }); });

                var gorunen = [];
                for (const [isim, grup] of Object.entries(gruplanmisKatmanlar)) {
                    var isimNorm = grup.baseNorm || normalizeName(isim);
                    // Bölüm adı birebir yazıldıysa yalnızca o bölümün eserleri; değilse isim eşleşmeleri de eklenir
                    var eslesiyor = kategoriSeti.has(isimNorm) || (!km.tam && isimNorm.includes(arananNorm));

                    if (eslesiyor) {
                        if (!markerKatmanlari.hasLayer(grup)) markerKatmanlari.addLayer(grup);
                        gorunen.push(grup);
                    } else {
                        if (markerKatmanlari.hasLayer(grup)) markerKatmanlari.removeLayer(grup);
                    }
                }

                // Sonuç bilgisi
                if (gorunen.length === 0) {
                    sonucYaz('Sonuç bulunamadı');
                } else if (eslesenKat.length > 0) {
                    var adlar = eslesenKat.slice(0, 2).map(function(k) { return kategoriIndeksi[k].baslik; }).join(', ');
                    if (eslesenKat.length > 2) adlar += ' +' + (eslesenKat.length - 2);
                    sonucYaz('📂 ' + adlar + ': ' + gorunen.length + ' eser gösteriliyor');
                } else {
                    sonucYaz(gorunen.length + ' sonuç gösteriliyor');
                }

                if (gorunen.length === 0 || arananNorm.length < 3) return;

                if (gorunen.length === 1) {
                    // Tek sonuç: eski davranış (yaklaş, popup aç, vurgula)
                    var hedefGrup = gorunen[0];
                    map.flyToBounds(hedefGrup.getBounds(), { padding: [50, 50], maxZoom: 17, duration: 1.2 });
                    aramaZamanlayici = setTimeout(function() {
                        if (!markerKatmanlari.hasLayer(hedefGrup)) return;
                        hedefGrup.openPopup();
                        hedefGrup.eachLayer(function(l) {
                            if (l.setStyle) l.setStyle({ color: '#ffeb3b', weight: 6 });
                        });
                    }, 500);
                } else {
                    // Çoklu sonuç: hepsini kapsayan görünüme git
                    var sinir = null;
                    gorunen.forEach(function(g) {
                        var b = g.getBounds();
                        if (b && b.isValid()) { if (!sinir) sinir = L.latLngBounds(b.getSouthWest(), b.getNorthEast()); else sinir.extend(b); }
                    });
                    if (sinir && sinir.isValid()) map.flyToBounds(sinir, { padding: [50, 50], maxZoom: 17, duration: 1.2 });
                }
            });
        }

        if (clearBtn) {
            clearBtn.addEventListener('click', function() {
                clearTimeout(aramaZamanlayici); map.stop();
                if (cmdInput) cmdInput.value = '';
                clearBtn.style.display = 'none';
                sonucYaz('');
                menuDurumunaGoreGeriYukle();
                map.setView([39.90618, 41.27666], 14);
            });
        }
    }, 100);

    function renkTespitEt(name, desc) {
        var str = (String(name) + " " + String(desc)).replace(/İ/g, 'i').replace(/I/g, 'ı').toLowerCase();
        if (str.includes('sur') || str.includes('kale')) return '#e67e22'; 
        if (str.includes('kapı') || str.includes('kapi')) return '#ff9800'; 
        if (str.includes('mahalle')) return '#fbc02d'; 
        if (str.includes('meydan') || str.includes('cadde') || str.includes('sokak') || str.includes('yer')) return '#4caf50'; 
        if (str.includes('mezarlık') || str.includes('şehitlik')) return '#9c27b0'; 
        if (str.includes('tabya')) return '#e67e22'; 
        if (str.includes('cami') || str.includes('mescit')) return '#2196f3'; 
        if (str.includes('han') || str.includes('mektep') || str.includes('matbaa')) return '#00bcd4'; 
        return '#e67e22';
    }

    // idx: aynı isimli eserlerde kaçıncı satırın aktif edileceği (0'dan başlar)
    function menuMaddesiniAktifEt(eserIsmi, idx) {
        idx = idx || 0;
        var normIsim = normalizeName(eserIsmi);
        var dizi = listeElemanlari[normIsim];
        if (!dizi) {
            for (var key in listeElemanlari) {
                if (normIsim.includes(key) || key.includes(normIsim)) { dizi = listeElemanlari[key]; break; }
            }
        }
        if (!dizi) return null;
        var e = dizi[Math.min(idx, dizi.length - 1)];
        e.li.classList.remove('aktif-degil');
        e.li.title = "Haritada Göster";
        return e;
    }

    function processKML(kmlText) {
        try {
            var parser = new DOMParser();
            var kmlDoc = parser.parseFromString(kmlText, 'text/xml');
            var geojson = toGeoJSON.kml(kmlDoc);

            if (!geojson || !geojson.features || geojson.features.length === 0) return;
            markerKatmanlari.clearLayers();
            gruplanmisKatmanlar = {};
            surNoktalari = { 1: [], 2: [], 3: [], 4: [] };
            var ornekSayac = {};   // aynı isimli eserler için sıra sayacı

            geojson.features.forEach(function(feature) {
                try {
                    if (!feature.geometry || !feature.geometry.coordinates) return;

                    var originalName = feature.properties && feature.properties.name ? feature.properties.name : 'İsimsiz';
                    originalName = adTemizle(String(originalName).trim());
                    var name = originalName;
                    var testName = String(originalName).replace(/İ/g, 'i').replace(/I/g, 'ı').toLowerCase().replace(/\s+/g, '');
                    var geomType = feature.geometry.type;
                    var coords = feature.geometry.coordinates;
                    var isPoint = (geomType === "Point");

                    // "Kuruluştan Günümüze Erzurum" noktası haritada gösterilmez; bilgisi (i) butonunda açılır
                    if (normalizeName(originalName).includes('kurulustangunumuze')) {
                        var d0 = feature.properties && feature.properties.description ? feature.properties.description : '';
                        return;
                    }

                    // Sur çizgilerinin noktalarını topla ("Surlar İçi Erzurum" alanı için)
                    var _surNo = (testName.match(/^([1-4])\.?sur/) || [])[1];
                    if (_surNo && !isPoint) {
                        (function topla(a) { if (typeof a[0] === 'number') surNoktalari[_surNo].push([a[0], a[1]]); else a.forEach(topla); })(coords);
                    }

                    if (testName.includes('kavakkap') && testName.includes('mezarl')) {
                        name = 'Kavakkapı Mezarlığı';
                    }
                    else if (isPoint) {
                        if (testName.includes('kavakkap') || testName.includes('kavak(ardahan)kap')) name = 'Kavak (Ardahan) Kapı';
                        else if (testName === 'istanbulkapı' || testName === 'istanbulkapi') name = 'İstanbul Kapı';
                        else if (testName === 'harputkapı' || testName === 'harputkapi') name = 'Harput Kapı';
                        else if (testName === 'karskapı' || testName === 'karskapi') name = 'Kars Kapı';
                    } else {
                        var is4SurCizgisiVeyaPoligonu = testName.includes('4.sur') || testName.startsWith('a/') || testName.startsWith('b/') ||
                            (testName.includes('kavakkap') && !testName.includes('mezarl')) || testName.includes('karskap') || 
                            testName.includes('istanbulkap') || testName.includes('harputkap') ||
                            testName.includes('ardahankap') || testName.includes('mecidiye') ||
                            testName.includes('tabya') || testName.includes('namazgah') ||
                            testName.includes('tufenklik') || testName.includes('tüfenklik') ||
                            testName.includes('kiremitlik') || testName.includes('aziziye') ||
                            testName === 'isimsiz' || testName === '' || testName.includes('cizgi') || testName.includes('çizgi') ||
                            testName.includes('polygon') || testName.includes('poligon');

                        if (is4SurCizgisiVeyaPoligonu) {
                            name = '4. Sur';
                        }
                    }

                    // ===== AYNI İSİMLİ ESERLERİ SIRAYLA AYRI GRUPLARA BAĞLA =====
                    name = name.replace(/^([1-4])\s*\.?\s*sur$/i, '$1. Sur');   // "1.sur" -> "1. Sur"
                    var baseNorm = normalizeName(name);
                    var girisler = listeElemanlari[baseNorm];
                    var coklu = !!(name !== '4. Sur' && girisler && girisler.length > 1);
                    var instIdx = 0, gKey = name;
                    if (coklu) {
                        var s = ornekSayac[baseNorm] || 0;
                        instIdx = Math.min(s, girisler.length - 1);
                        ornekSayac[baseNorm] = s + 1;
                        if (instIdx > 0) gKey = name + ' #' + (instIdx + 1);
                    }

                    var desc = feature.properties && feature.properties.description ? feature.properties.description : '';
                    var pinRengi = renkTespitEt(name, desc); 
                    
                    if (name === '4. Sur') {
                        pinRengi = '#e67e22'; 
                    } else if (isPoint && (testName.includes('kapı') || testName.includes('kapi'))) {
                        pinRengi = '#ff9800'; 
                    }

                    // Bölüm başlığındaki rengi içeriğe uygula (sur ve kapılar turuncuda kalır)
                    var _kat = usteBagliGruplar[baseNorm] || '';
                    var _surKapi = /^[1-4]sur$/.test(baseNorm) || _kat === 'kapilar' || _kat === 'surlar';
                    if (kategoriRenkleri[_kat] && !_surKapi) pinRengi = kategoriRenkleri[_kat];

                    var isSur = name.toLowerCase().includes('sur');
                    var cizgiKalinligi = isSur ? 6 : 4; 
                    var poligonKalinligi = isSur ? 4 : 3;
                    var poligonSaydamlik = (name === '4. Sur' || name.toLowerCase().includes('tabya')) ? 0.1 : 0.4;

                    var layer;
                    if (isPoint) {
                        // Tek örnekli eserlerde tekrar eden noktalar atlanır (eski davranış)
                        if (!coklu && gruplanmisKatmanlar[gKey] && gruplanmisKatmanlar[gKey].hasPointMarker) {
                            return; 
                        }
                        layer = L.circleMarker([coords[1], coords[0]], { pane: 'noktaPane', radius: 8, fillColor: pinRengi, color: '#fff', weight: 2, fillOpacity: 0.9 });
                    } else if (geomType === "LineString" && coords.length > 0) {
                        layer = L.polyline(coords.map(c => [c[1], c[0]]), { pane: isSur ? 'surPane' : 'overlayPane', color: pinRengi, weight: cizgiKalinligi, opacity: 0.95 });
                    } else if (geomType === "MultiLineString" && coords.length > 0) {
                        layer = L.polyline(coords.map(line => line.map(c => [c[1], c[0]])), { pane: isSur ? 'surPane' : 'overlayPane', color: pinRengi, weight: cizgiKalinligi, opacity: 0.95 });
                    } else if (geomType === "Polygon" && coords.length > 0) {
                        layer = L.polygon(coords[0].map(c => [c[1], c[0]]), { className: isSur ? 'sur-alan' : '', color: pinRengi, weight: poligonKalinligi, fillColor: pinRengi, fillOpacity: poligonSaydamlik });
                    } else if (geomType === "MultiPolygon" && coords.length > 0) {
                        layer = L.polygon(coords.map(poly => poly[0].map(c => [c[1], c[0]])), { className: isSur ? 'sur-alan' : '', color: pinRengi, weight: poligonKalinligi, fillColor: pinRengi, fillOpacity: poligonSaydamlik });
                    }

                    if (layer) {
                        layer._orijinalStil = isPoint ? { radius: 8, weight: 2, color: '#fff' } : { color: pinRengi, weight: (geomType.indexOf('Polygon') >= 0 ? poligonKalinligi : cizgiKalinligi) };
                        if (!gruplanmisKatmanlar[gKey]) {
                            gruplanmisKatmanlar[gKey] = L.featureGroup();
                            gruplanmisKatmanlar[gKey].hasPointMarker = false;
                            gruplanmisKatmanlar[gKey].baseNorm = baseNorm;
                            
                            let ustKatKod = usteBagliGruplar[baseNorm] || "";
                            
                            if (ustKatKod && kategoriAcikDurumu[ustKatKod] === true) {
                                gruplanmisKatmanlar[gKey].addTo(markerKatmanlari);
                            }
                            
                            gruplanmisKatmanlar[gKey].options = { bireyselGizli: false, orijinalRenk: pinRengi };
                            
                            // 2., 3. ... örnekler için degirmen2.jpg gibi ayrı foto; yoksa ilk fotoğrafa düşer
                            var sfx = instIdx > 0 ? String(instIdx + 1) : '';
                            var adaylar = [eskiResimAdi(name) + sfx, normalizeName(name) + sfx];
                            if (sfx) adaylar.push(eskiResimAdi(name), normalizeName(name));
                            adaylar = adaylar.filter(function(v, i, a) { return v && a.indexOf(v) === i; });
                            var resimDosyaIsmi = adaylar[0];
                            var altListe = adaylar.slice(1).map(function(a) { return 'fotograflar/' + a + '.jpg'; }).join('|');
                            var onerrorKodu = adaylar.length > 1
                                ? `var a=(this.dataset.alt===undefined?'${altListe}':this.dataset.alt).split('|').filter(Boolean);if(a.length){this.dataset.alt=a.slice(1).join('|');this.src=a[0];}else{this.style.display='none'}`
                                : `this.style.display='none'`;
                            var bilgiKartiHTML = `
                                <div style="font-family: 'Segoe UI', sans-serif; min-width: 200px; max-width: 280px; text-align: center;">
                                    <h3 style="margin: 0 0 10px 0; color: #333; font-size: 16px; border-bottom: 2px solid ${pinRengi}; padding-bottom: 5px;">${name}</h3>
                                    <img src="fotograflar/${resimDosyaIsmi}.jpg" style="width: 100%; border-radius: 8px; margin-bottom: 10px;" onerror="${onerrorKodu}">
                                    <p style="margin: 0; color: #555; font-size: 13px; text-align: left;">${desc || 'Bu eser için henüz bir açıklama bulunmuyor.'}</p>
                                </div>
                            `;
                            
                            gruplanmisKatmanlar[gKey].bindPopup(bilgiKartiHTML, { maxHeight: 340, maxWidth: 300, minWidth: 220, closeButton: true, autoPanPadding: [20, 20] });
                            gruplanmisKatmanlar[gKey].bindTooltip(`<b>${name}</b>`, { direction: 'top', offset: [0, -8] });
                            
                            var itemData = coklu ? menuMaddesiniAktifEt(name, instIdx) : menuMaddesiniAktifEt(name);

                            if (itemData) {
                                let menuItem = itemData.li;
                                let itemGoz = itemData.goz;
                                let uKatKodu = itemData.ustKategoriKodu;

                                if (itemGoz) {
                                    itemGoz.style.display = 'inline-block';
                                    itemGoz.onclick = function(e) {
                                        e.stopPropagation();
                                        let gizliMi = itemGoz.classList.toggle('gizli');
                                        let grup = gruplanmisKatmanlar[gKey];
                                        grup.options.bireyselGizli = gizliMi;
                                        
                                        if (gizliMi) {
                                            if (markerKatmanlari.hasLayer(grup)) markerKatmanlari.removeLayer(grup);
                                        } else {
                                            if (kategoriAcikDurumu[uKatKodu]) {
                                                if (!markerKatmanlari.hasLayer(grup)) markerKatmanlari.addLayer(grup);
                                            } else {
                                                alert("Üst kategori kapalı olduğu için haritada gösterilemiyor.");
                                                itemGoz.classList.add('gizli');
                                                grup.options.bireyselGizli = true;
                                            }
                                        }
                                    };
                                }
                                
                                menuItem.onclick = function(e) { 
                                    if (e.target === itemGoz) return; 
                                    
                                    if (uKatKodu && !kategoriAcikDurumu[uKatKodu]) {
                                        alert("Bağlı bulunduğu ana kategori kapalı olduğu için bu öğe şu anda gösterilemez. Önce ana kategorinin göz ikonunu açınız.");
                                        return;
                                    }
                                    
                                    if (!markerKatmanlari.hasLayer(gruplanmisKatmanlar[gKey])) return; 

                                    map.flyToBounds(gruplanmisKatmanlar[gKey].getBounds(), { padding: [50, 50], maxZoom: 17, duration: 1.5 });
                                    setTimeout(() => gruplanmisKatmanlar[gKey].openPopup(), 600);
                                };
                                
                                menuItem.onmouseenter = function() {
                                    radarKatmani.clearLayers(); 
                                    if (!markerKatmanlari.hasLayer(gruplanmisKatmanlar[gKey])) return; 
                                    
                                    var bounds = gruplanmisKatmanlar[gKey].getBounds();
                                    L.marker(bounds.getCenter(), { icon: L.divIcon({ className: 'radar-pulse', iconSize: [20, 20] }), interactive: false }).addTo(radarKatmani);

                                    gruplanmisKatmanlar[gKey].eachLayer(l => {
                                        if (l instanceof L.CircleMarker) l.setStyle({ radius: 10, weight: 0 }); 
                                        else l.setStyle({ color: '#ffeb3b', weight: 8 });
                                    });
                                    gruplanmisKatmanlar[gKey].openTooltip();
                                };
                                
                                menuItem.onmouseleave = function() {
                                    radarKatmani.clearLayers(); 
                                    if (!markerKatmanlari.hasLayer(gruplanmisKatmanlar[gKey])) return;

                                    gruplanmisKatmanlar[gKey].eachLayer(l => {
                                        if (l instanceof L.CircleMarker) l.setStyle({ radius: 8, weight: 2, color: '#fff' }); 
                                        else l.setStyle({ color: pinRengi, weight: (l instanceof L.Polygon ? poligonKalinligi : cizgiKalinligi) });
                                    });
                                    gruplanmisKatmanlar[gKey].closeTooltip();
                                };
                            }
                        }

                        if (isPoint) {
                            gruplanmisKatmanlar[gKey].hasPointMarker = true;
                        }

                        gruplanmisKatmanlar[gKey].addLayer(layer);
                    }
                } catch (innerE) { console.warn("Çizim atlandı:", innerE); }
            });

            surSiniriSecenekleriniKur();
            document.getElementById('drop-zone').classList.add('hidden');
        } catch (e) { alert("Hata: " + e.message); }
    }

    function handleFile(file) {
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(evt) { processKML(evt.target.result); };
        reader.readAsText(file, "UTF-8");
    }


</script>
